<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estimateur toiture en bardeaux</title>
    <meta name="theme-color" content="#176b5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Toiture">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="estimate-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Agent de soumission</p>
            <h1>Toiture en bardeaux</h1>
          </div>
          <button id="resetBtn" class="icon-button" type="button" title="Reinitialiser">R</button>
        </header>

        <div class="workspace">
          <form id="estimateForm" class="input-pane">
            <section class="band">
              <div class="section-title">
                <h2>Projet</h2>
                <span id="fileStatus">Aucun fichier</span>
              </div>
              <label>
                Client ou adresse
                <input id="projectName" type="text" value="Soumission toiture" autocomplete="off">
              </label>
              <label>
                Plans, devis ou notes
                <input id="files" type="file" multiple accept=".txt,.csv,.pdf,.png,.jpg,.jpeg,.doc,.docx">
              </label>
              <label>
                Mesures ou extrait de devis
                <textarea id="notes" rows="8" placeholder="Ex.: superficie toiture 2450 pi2, faite 58 pi, noues 32 pi, demarreur 180 pi, bord de mur 40 pi, ventilateurs 2, plomberie 6, heures 42"></textarea>
              </label>
            </section>

            <section class="band">
              <div class="section-title">
                <h2>Projets sauvegardes</h2>
                <span id="saveStatus">Non sauvegarde</span>
              </div>
              <div class="project-actions">
                <select id="projectList" aria-label="Projets sauvegardes"></select>
                <button id="saveProjectBtn" class="text-button primary" type="button">Sauvegarder</button>
                <button id="loadProjectBtn" class="text-button" type="button">Ouvrir</button>
                <button id="deleteProjectBtn" class="text-button danger" type="button">Supprimer</button>
                <button id="exportProjectBtn" class="text-button" type="button">Exporter</button>
                <label class="file-button">
                  Importer
                  <input id="importProject" type="file" accept=".json,application/json">
                </label>
              </div>
            </section>

            <section class="band">
              <div class="section-title">
                <h2>Mesures</h2>
                <button id="parseBtn" class="text-button" type="button">Lire les notes</button>
              </div>
              <div class="grid two">
                <label>Surface toiture pi2<input id="roofArea" type="number" min="0" step="1" value="2200"></label>
                <label>Faite/aretes pi<input id="ridgeFeet" type="number" min="0" step="1" value="70"></label>
                <label>Noues pi<input id="valleyFeet" type="number" min="0" step="1" value="30"></label>
                <label>Demarreur pi<input id="starterFeet" type="number" min="0" step="1" value="180"></label>
                <label>Bord de mur pi<input id="wallEdgeFeet" type="number" min="0" step="1" value="0"></label>
                <label>Ventilateurs<input id="roofFans" type="number" min="0" step="1" value="0"></label>
                <label>Event de plomberie<input id="plumbingVents" type="number" min="0" step="1" value="6"></label>
              </div>
            </section>

            <section class="band">
              <h2>Produits</h2>
              <div class="grid two">
                <label>Bardeau / paquet<input id="shinglePrice" type="number" min="0" step="0.01" value="42"></label>
                <label>Bardeau de Faitiere / paquet<input id="ridgeCapPrice" type="number" min="0" step="0.01" value="48"></label>
                <label>Membrane Synthetique / rouleau<input id="syntheticMembranePrice" type="number" min="0" step="0.01" value="72"></label>
                <label>Membrane Autocollante / rouleau<input id="selfAdhesiveMembranePrice" type="number" min="0" step="0.01" value="95"></label>
                <label>Noue / pi<input id="valleyPrice" type="number" min="0" step="0.01" value="2.25"></label>
                <label>Bord de Mur / pi<input id="wallEdgePrice" type="number" min="0" step="0.01" value="3.50"></label>
                <label>Clous / boite<input id="nailBoxPrice" type="number" min="0" step="0.01" value="45"></label>
                <label>Agrafes / boite<input id="stapleBoxPrice" type="number" min="0" step="0.01" value="22"></label>
                <label>Ventilateurs / unite<input id="roofFanPrice" type="number" min="0" step="0.01" value="85"></label>
                <label>Events de Plomberie / unite<input id="plumbingVentPrice" type="number" min="0" step="0.01" value="28"></label>
                <label>Pitch / unite<input id="pitchPrice" type="number" min="0" step="0.01" value="18"></label>
              </div>
            </section>

            <section class="band">
              <h2>Materiaux</h2>
              <div class="grid two">
                <label>Couverture / paquet pi2<input id="bundleCoverage" type="number" min="1" step="0.1" value="33.3"></label>
                <label>Rouleau sous-couche pi2<input id="underlaymentRollCoverage" type="number" min="1" step="1" value="400"></label>
                <label>Boite clous / paquets<input id="nailBoxBundles" type="number" min="1" step="1" value="20"></label>
                <label>Boite agrafes / paquets<input id="stapleBoxBundles" type="number" min="1" step="1" value="30"></label>
                <label>Cap faîte / paquet pi<input id="ridgeCapCoverage" type="number" min="1" step="1" value="25"></label>
                <label>Glace/eau rouleau pi<input id="iceRollCoverage" type="number" min="1" step="1" value="65"></label>
              </div>
            </section>

            <section class="band">
              <h2>Main-d'oeuvre et profit</h2>
              <div class="grid two">
                <label>Heures prevues<input id="hours" type="number" min="0" step="0.5" value="40"></label>
                <label>Cout horaire equipe<input id="hourlyCost" type="number" min="0" step="0.01" value="75"></label>
                <label>Conteneur et disposition<input id="disposal" type="number" min="0" step="1" value="850"></label>
                <label>Frais fixes<input id="overhead" type="number" min="0" step="1" value="650"></label>
                <label>Profit %<input id="profitPct" type="number" min="0" step="0.5" value="18"></label>
                <label>Profit cible / heure<input id="profitPerHour" type="number" min="0" step="1" value="85"></label>
                <label>Taxes %<input id="taxPct" type="number" min="0" step="0.001" value="14.975"></label>
              </div>
            </section>
          </form>

          <aside class="result-pane">
            <section class="summary mobile-total">
              <p class="eyebrow">Montant recommande</p>
              <output id="total">$0</output>
              <div class="summary-row">
                <span>Avant taxes</span>
                <strong id="subtotal">$0</strong>
              </div>
              <div class="summary-row">
                <span>Taxes</span>
                <strong id="taxes">$0</strong>
              </div>
            </section>

            <section class="metrics">
              <h2>Metriques</h2>
              <div class="metric-grid">
                <div><span>Cout direct</span><strong id="directCost">$0</strong></div>
                <div><span>Profit inclus</span><strong id="profit">$0</strong></div>
                <div><span>Profit / heure</span><strong id="profitHour">$0</strong></div>
                <div><span>Paquets</span><strong id="bundles">0</strong></div>
              </div>
            </section>

            <section class="breakdown">
              <div class="section-title">
                <h2>Liste de materiaux</h2>
                <div class="button-row">
                  <button id="copyMaterialsBtn" class="text-button" type="button">Copier</button>
                  <button id="exportMaterialsBtn" class="text-button" type="button">CSV</button>
                </div>
              </div>
              <div id="materialsList" class="materials-list"></div>
            </section>

            <section class="breakdown">
              <div class="section-title">
                <h2>Detail</h2>
                <button id="copyBtn" class="text-button" type="button">Copier</button>
              </div>
              <pre id="estimateText"></pre>
            </section>
          </aside>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
